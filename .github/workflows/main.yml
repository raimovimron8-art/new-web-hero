
name: Build Neon Web Hero APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.4.1

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract game project
        run: |
          unzip -o NeonWebHero-Godot-Android-Project.zip -d .
          cd NeonWebHeroProject
          mkdir -p build

      - name: Check project
        run: |
          cd NeonWebHeroProject
          godot --headless --editor --path . --quit

      - name: Upload project files
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Web-Hero-Project
          path: NeonWebHeroProject/
